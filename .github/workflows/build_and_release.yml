name: Build & Release Multi-Platform (Android APK, Windows EXE, iOS)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Android APK Build
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Production Release APK
        run: flutter build apk --release

      - name: Rename APK for Release
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/FOCUS-Android-v1.0.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOCUS-Android-APK
          path: release-artifacts/FOCUS-Android-v1.0.0.apk

  # -------------------------------------------------------------
  # 2. Windows Desktop EXE Build
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Package Windows Binary Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release-artifacts\FOCUS-Windows-v1.0.0.zip

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOCUS-Windows-EXE
          path: release-artifacts\FOCUS-Windows-v1.0.0.zip

  # -------------------------------------------------------------
  # 3. iOS Runner Build
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Unsigned Release)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Bundle
        run: |
          mkdir -p release-artifacts
          cd build/ios/iphoneos && zip -r ../../../release-artifacts/FOCUS-iOS-v1.0.0.zip Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOCUS-iOS-Bundle
          path: release-artifacts/FOCUS-iOS-v1.0.0.zip

  # -------------------------------------------------------------
  # 4. Publish GitHub Release with all variants
  # -------------------------------------------------------------
  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: FOCUS-Android-APK
          path: release-bundle

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: FOCUS-Windows-EXE
          path: release-bundle

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: FOCUS-iOS-Bundle
          path: release-bundle

      - name: Create GitHub Release with 3 Variants
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundle/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "FOCUS Personal OS - Release ${{ github.ref_name || 'v1.0.0' }}"
          body: |
            ## FOCUS Personal OS - Production Release
            
            Download the production binaries directly below:
            
            - 🤖 **Android**: `FOCUS-Android-v1.0.0.apk`
            - 🪟 **Windows**: `FOCUS-Windows-v1.0.0.zip` (Portable bundle with `focus_app.exe`)
            - 🍎 **iOS**: `FOCUS-iOS-v1.0.0.zip` (Unsigned `Runner.app` for device/simulator deployment)
